name: boxsight

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boxsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-boxsight}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-30}
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-boxsight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-boxsight}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-boxsight}:${POSTGRES_PASSWORD}@postgres:5432/boxsight_test
      STORAGE_DIR: /app/storage/images
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      INFERENCE_BACKEND: yolo
      MODEL_PATH: /models/best.pt
    volumes:
      - uploads:/app/storage/images
      - ./model/weights:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
